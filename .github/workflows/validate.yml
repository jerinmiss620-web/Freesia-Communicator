name: Validate Freesia Messenger releases

on:
  push:
    branches: [main, test-direct-esm-import]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify manifests, hashes, lengths and syntax
        run: node scripts/verify-release.mjs
