name: Validate Remote Bootstrap and Loader

on:
  push:
    paths:
      - 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.js'
      - 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.json'
      - 'loader/runtime/v0.1.6/**'
      - 'loader/latest.json'
      - 'latest.json'
      - 'channels/test.json'
      - '.github/workflows/validate-remote-bootstrap.yml'
  pull_request:
    paths:
      - 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.js'
      - 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.json'
      - 'loader/runtime/v0.1.6/**'
      - 'loader/latest.json'
      - 'latest.json'
      - 'channels/test.json'
      - '.github/workflows/validate-remote-bootstrap.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check loader/runtime/v0.1.6/Freesia-Messenger-Remote-Loader.js
          node --check bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.js
      - name: Release integrity and migration contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');

          const loaderPath = 'loader/runtime/v0.1.6/Freesia-Messenger-Remote-Loader.js';
          const bootstrapPath = 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.js';
          const packagePath = 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.json';
          const loader = fs.readFileSync(loaderPath, 'utf8');
          const bootstrap = fs.readFileSync(bootstrapPath, 'utf8');
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const loaderManifest = JSON.parse(fs.readFileSync('loader/latest.json', 'utf8'));
          const stable = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          const test = JSON.parse(fs.readFileSync('channels/test.json', 'utf8'));
          const oldPackage = JSON.parse(fs.readFileSync('bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.4.json', 'utf8'));

          assert.equal(pkg.content, bootstrap, 'Bootstrap JSON content must exactly match its standalone JS');
          assert.equal(pkg.id, oldPackage.id, 'Bootstrap script ID must be preserved');
          assert.equal(pkg.enabled, false, 'New Bootstrap package must import disabled');
          assert.equal(loaderManifest.latest_version, '0.1.6');
          assert.equal(loaderManifest.minimum_bootstrap_version, '1.0.5');
          assert.equal(loaderManifest.release.version, '0.1.6');
          assert.equal(loaderManifest.release.source_path, loaderPath);
          assert.equal(loaderManifest.release.source_url,
            'https://raw.githubusercontent.com/jerinmiss620-web/Freesia-Communicator/' +
            loaderManifest.release.source_commit + '/' + loaderPath);
          assert.equal(loaderManifest.release.size_bytes, Buffer.byteLength(loader, 'utf8'));
          assert.equal(loaderManifest.release.sha256,
            crypto.createHash('sha256').update(loader, 'utf8').digest('hex'));
          assert.equal(stable.minimum_loader_version, '0.1.6');
          assert.equal(test.minimum_loader_version, '0.1.6');
          assert.match(loader, /writeLocalStorageRecord\(CANDIDATE_KEY, record\)/);
          assert.doesNotMatch(loader, /writeIndexedRecord\s*\(/, 'No IndexedDB write may remain in the Core install path');
          assert.match(bootstrap, /ensureLegacyRollback\(running\)/);
          const evaluate = bootstrap.slice(bootstrap.indexOf('async function evaluate(record)'), bootstrap.indexOf('async function installRecord'));
          assert.equal((evaluate.match(/await remoteRuntime\.ready/g) || []).length, 1);
          assert.equal((evaluate.match(/await blobRuntime\.ready/g) || []).length, 1);
          assert.doesNotMatch(evaluate, /await currentRuntime\(\)\.ready/);
          console.log('Remote Bootstrap / Loader release checks passed.');
          NODE
