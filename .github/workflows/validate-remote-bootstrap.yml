name: Validate Remote Bootstrap and Loader

on:
  push:
    paths:
      - 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.js'
      - 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.json'
      - 'loader/runtime/v0.1.6/**'
      - 'loader/latest.json'
      - 'latest.json'
      - 'channels/test.json'
      - 'install/Freesia-Messenger-Permanent-Bootstrap-1.0.8-TEST.json'
      - 'loader/test-latest.json'
      - 'loader/runtime/v0.1.8/**'
      - 'core/v0.3.38/**'
      - '.github/workflows/validate-remote-bootstrap.yml'
  pull_request:
    paths:
      - 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.js'
      - 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.json'
      - 'loader/runtime/v0.1.6/**'
      - 'loader/latest.json'
      - 'latest.json'
      - 'channels/test.json'
      - 'install/Freesia-Messenger-Permanent-Bootstrap-1.0.8-TEST.json'
      - 'loader/test-latest.json'
      - 'loader/runtime/v0.1.8/**'
      - 'core/v0.3.38/**'
      - '.github/workflows/validate-remote-bootstrap.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check loader/runtime/v0.1.6/Freesia-Messenger-Remote-Loader.js
          node --check bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.js
      - name: Release integrity and migration contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const { Script } = require('node:vm');

          const loaderPath = 'loader/runtime/v0.1.6/Freesia-Messenger-Remote-Loader.js';
          const bootstrapPath = 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.js';
          const packagePath = 'bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.5.json';
          const loader = fs.readFileSync(loaderPath, 'utf8');
          const bootstrap = fs.readFileSync(bootstrapPath, 'utf8');
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const loaderManifest = JSON.parse(fs.readFileSync('loader/latest.json', 'utf8'));
          const stable = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          const test = JSON.parse(fs.readFileSync('channels/test.json', 'utf8'));
          const oldPackage = JSON.parse(fs.readFileSync('bootstrap/Freesia-Communicator-Permanent-Bootstrap-1.0.4.json', 'utf8'));

          assert.equal(pkg.content, bootstrap, 'Bootstrap JSON content must exactly match its standalone JS');
          assert.equal(pkg.id, oldPackage.id, 'Bootstrap script ID must be preserved');
          assert.equal(pkg.enabled, false, 'New Bootstrap package must import disabled');
          assert.equal(loaderManifest.latest_version, '0.1.6');
          assert.equal(loaderManifest.minimum_bootstrap_version, '1.0.5');
          assert.equal(loaderManifest.release.version, '0.1.6');
          assert.equal(loaderManifest.release.source_path, loaderPath);
          assert.equal(loaderManifest.release.source_url,
            'https://raw.githubusercontent.com/jerinmiss620-web/Freesia-Communicator/' +
            loaderManifest.release.source_commit + '/' + loaderPath);
          assert.equal(loaderManifest.release.size_bytes, Buffer.byteLength(loader, 'utf8'));
          assert.equal(loaderManifest.release.sha256,
            crypto.createHash('sha256').update(loader, 'utf8').digest('hex'));
          assert.equal(stable.minimum_loader_version, '0.1.6');
          assert.equal(test.minimum_loader_version, '0.1.6');
          assert.match(loader, /writeLocalStorageRecord\(CANDIDATE_KEY, record\)/);
          assert.doesNotMatch(loader, /writeIndexedRecord\s*\(/, 'No IndexedDB write may remain in the Core install path');
          assert.match(bootstrap, /ensureLegacyRollback\(running\)/);
          const evaluate = bootstrap.slice(bootstrap.indexOf('async function evaluate(record)'), bootstrap.indexOf('async function installRecord'));
          assert.equal((evaluate.match(/await remoteRuntime\.ready/g) || []).length, 1);
          assert.equal((evaluate.match(/await blobRuntime\.ready/g) || []).length, 1);
          assert.doesNotMatch(evaluate, /await currentRuntime\(\)\.ready/);
          const testLoaderPath = 'loader/runtime/v0.1.8/Freesia-Messenger-Remote-Loader.js';
          const testCorePath = 'core/v0.3.38/Freesia-Messenger.js';
          const testBootstrapPath = 'install/Freesia-Messenger-Permanent-Bootstrap-1.0.8-TEST.json';
          const testLoader = fs.readFileSync(testLoaderPath, 'utf8');
          const testCore = fs.readFileSync(testCorePath, 'utf8');
          const testBootstrap = JSON.parse(fs.readFileSync(testBootstrapPath, 'utf8'));
          const testLoaderManifest = JSON.parse(fs.readFileSync('loader/test-latest.json', 'utf8'));
          const testCoreManifest = JSON.parse(fs.readFileSync('channels/test.json', 'utf8'));
          assert.equal(testBootstrap.id, pkg.id, 'TEST Bootstrap must preserve the existing script ID');
          assert.equal(testBootstrap.enabled, true, 'TEST Bootstrap package must import enabled');
          assert.match(testBootstrap.content, /const VERSION = '1\.0\.8'/, 'TEST Bootstrap runtime version mismatch');
          assert.match(testBootstrap.content, /freesia_messenger_update_channel_v1/, 'TEST Bootstrap must select the Core test channel');
          assert.match(testBootstrap.content, /storage\.setItem\(CORE_CHANNEL_KEY, 'test'\)/, 'TEST Bootstrap must set the test channel before Loader startup');
          assert.match(testBootstrap.content, /restoreTestChannel\?\.\(\)/, 'TEST Bootstrap must restore the prior persistent channel preference');
          assert.match(testBootstrap.content, /freesia-messenger-loader-auto-update-preference/, 'TEST Bootstrap must retry Core update after safe adoption');
          assert.match(testBootstrap.content, /async function waitForLoaderIdle/, 'TEST Bootstrap must wait for a busy legacy Loader before migration');
          assert.match(testBootstrap.content, /await waitForLoaderIdle\(running\)/, 'Loader migration must wait for the active runtime to become idle');
          assert.match(testBootstrap.content, /远程版本 v\[\\d\.\]\+ 低于当前运行版本/, 'Legacy stale Core downgrade toast must be filtered during migration');
          const startupBlock = testBootstrap.content.slice(testBootstrap.content.indexOf('async function startup()'), testBootstrap.content.indexOf('function destroy()', testBootstrap.content.indexOf('async function startup()')));
          assert.ok(startupBlock.indexOf('await refreshAutomatic()') < startupBlock.indexOf('await installRecord(cached)'), 'Remote Loader must be attempted before offline cached Loader fallback');
          assert.match(startupBlock, /if \(!closed && !currentRuntime\(\) && cached\)/, 'Cached Loader must be used only as offline fallback');
          assert.equal(testLoaderManifest.latest_version, '0.1.8');
          assert.equal(testLoaderManifest.minimum_bootstrap_version, '1.0.6');
          assert.equal(testLoaderManifest.release.source_path, testLoaderPath);
          assert.equal(testLoaderManifest.release.source_url,
            'https://raw.githubusercontent.com/jerinmiss620-web/Freesia-Communicator/' +
            testLoaderManifest.release.source_commit + '/' + testLoaderPath);
          assert.equal(testLoaderManifest.release.size_bytes, Buffer.byteLength(testLoader, 'utf8'));
          assert.equal(testLoaderManifest.release.sha256, crypto.createHash('sha256').update(testLoader, 'utf8').digest('hex'));
          assert.equal(testCoreManifest.latest_version, '0.3.38');
          assert.equal(testCoreManifest.release.version, '0.3.38');
          assert.equal(testCoreManifest.release.source_path, testCorePath);
          assert.equal(testCoreManifest.release.sha256, crypto.createHash('sha256').update(testCore, 'utf8').digest('hex'));
          assert.equal(testCoreManifest.release.size_bytes, Buffer.byteLength(testCore, 'utf8'));
          assert.match(testCore, /data-fm-ext-field="mobile-size"/, 'Mobile window size selector missing');
          assert.match(testCore, /bounds\.width \* \(compact \? 0\.9 : 1\)/, '90% mobile width calculation missing');
          assert.match(testCore, /bounds\.height \* \(compact \? 0\.9 : 1\)/, '90% mobile height calculation missing');
          assert.match(testCore, /const maxWidth = Math\.min\(520, bounds\.width - 16\);/, 'PC window width clamp changed unexpectedly');
          new Script(testBootstrap.content, { filename: testBootstrapPath });
          new Script(testLoader, { filename: testLoaderPath });
          new Script(testCore, { filename: testCorePath });
          console.log('Stable and TEST Bootstrap / Loader / Core release checks passed.');
          NODE
